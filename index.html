<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사과 팡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* Layout: one-screen portrait app — HUD, timer, kraft fruit tray of apples, controls */
  :root {
    --bg: #eef2e4;
    --fg: #1f2a1a;
    --muted: #5d6a52;
    --card: #fbfcf7;
    --line: #d3dcc4;
    --tray: #e6d4ae;
    --tray-line: #d5bf92;
    --tray-edge: #c9ab74;
    --apple: #d6283c;
    --apple-hi: #ff7a7a;
    --apple-dark: #8c1323;
    --apple-ink: #ffffff;
    --leaf: #3d8b37;
    --sel: #e89d00;
    --ok: #2b9a42;
    --bad: #c92a2a;
    --shadow: rgba(60, 50, 20, .18);
    --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12170f; --fg: #e8eedd; --muted: #9ba891; --card: #1c2318; --line: #2f3a28;
      --tray: #2c2417; --tray-line: #3b3121; --tray-edge: #4a3c25;
      --apple: #e0324a; --apple-hi: #ff8a8a; --apple-dark: #7e1020; --apple-ink: #ffffff;
      --leaf: #5bb352; --sel: #ffc23d; --ok: #57d06e; --bad: #ff6b6b; --shadow: rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12170f; --fg: #e8eedd; --muted: #9ba891; --card: #1c2318; --line: #2f3a28;
    --tray: #2c2417; --tray-line: #3b3121; --tray-edge: #4a3c25;
    --apple: #e0324a; --apple-hi: #ff8a8a; --apple-dark: #7e1020; --apple-ink: #ffffff;
    --leaf: #5bb352; --sel: #ffc23d; --ok: #57d06e; --bad: #ff6b6b; --shadow: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  html { height: 100%; box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 15px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    position: relative; height: 100%; max-width: 560px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 10px;
    padding-inline: 16px; padding-block: 12px;
  }

  .hud { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo {
    margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px;
    color: var(--apple); line-height: 1; display: flex; align-items: center; gap: 6px;
  }
  .logo small { font-size: 13px; color: var(--muted); font-family: var(--font-body); }
  .stats { display: flex; gap: 14px; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
  .stat .label { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
  .stat .val { font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }

  .timer {
    position: relative; height: 22px; border-radius: 11px; overflow: hidden;
    background: var(--line);
  }
  .timer-fill {
    position: absolute; inset: 0; transform-origin: left center;
    background: var(--leaf); transition: background-color .3s;
  }
  .timer.low .timer-fill { background: var(--apple); }
  .timer-text {
    position: relative; display: block; text-align: center; line-height: 22px;
    font-family: var(--font-display); font-size: 14px; color: var(--fg);
    font-variant-numeric: tabular-nums;
  }

  .board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; padding: 8px; }
  .board {
    --cs: 34px;
    position: relative; touch-action: none; border-radius: 10px;
    background-color: var(--tray);
    background-image:
      linear-gradient(var(--tray-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--tray-line) 1px, transparent 1px);
    background-size: var(--cs) var(--cs);
    box-shadow: 0 0 0 7px var(--tray-edge), 0 12px 28px var(--shadow);
  }

  .apple {
    position: absolute; width: var(--cs); height: var(--cs);
    left: calc(var(--c) * var(--cs)); top: calc(var(--r) * var(--cs));
    display: grid; place-items: center; pointer-events: none;
    transition: transform .08s;
  }
  .apple::before {
    content: ""; position: absolute; inset: 10% 8% 6%;
    border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%;
    background: radial-gradient(circle at 32% 30%, var(--apple-hi), var(--apple) 45%, var(--apple-dark));
    box-shadow: inset 0 -2px 3px rgba(0, 0, 0, .18);
  }
  .apple::after {
    content: ""; position: absolute; top: 2%; left: 50%;
    width: 26%; height: 15%; background: var(--leaf);
    border-radius: 0 100% 0 100%; transform: rotate(-18deg);
  }
  .apple b {
    position: relative; z-index: 1; font-family: var(--font-display); font-weight: 400;
    font-size: calc(var(--cs) * .5); color: var(--apple-ink); margin-top: 8%;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
  }
  .apple.sel { transform: scale(1.1); }
  .apple.sel::before { box-shadow: 0 0 0 2px var(--sel), inset 0 -2px 3px rgba(0, 0, 0, .18); }
  .apple.hint { animation: hint .5s ease-in-out 3 alternate; }
  .apple.pop { animation: pop .32s ease-out forwards; }
  .apple.gone { visibility: hidden; animation: none; }
  @keyframes pop {
    40% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(0) translateY(-30%); opacity: 0; }
  }
  @keyframes hint { to { transform: scale(1.18) rotate(-6deg); } }

  .sel-box {
    position: absolute; z-index: 2; pointer-events: none; border-radius: 6px;
    border: 2px dashed var(--sel);
    background: color-mix(in srgb, var(--sel) 16%, transparent);
  }
  .sel-box.ten { border-style: solid; border-color: var(--ok); background: color-mix(in srgb, var(--ok) 20%, transparent); }
  .sel-sum {
    position: absolute; left: -2px; bottom: calc(100% + 4px);
    padding: 2px 8px; border-radius: 10px; white-space: nowrap;
    font-family: var(--font-display); font-size: 15px;
    background: var(--sel); color: var(--card);
  }
  .sel-box.ten .sel-sum { background: var(--ok); }
  .sel-box.over .sel-sum { background: var(--bad); }

  .float {
    position: absolute; z-index: 3; pointer-events: none; transform: translate(-50%, -50%);
    font-family: var(--font-display); font-size: 26px; color: var(--ok);
    text-shadow: 0 2px 0 var(--card);
    animation: rise .8s ease-out forwards;
  }
  @keyframes rise { to { transform: translate(-50%, -150%); opacity: 0; } }

  .controls { display: flex; gap: 8px; }
  button {
    font: inherit; font-family: var(--font-display); font-size: 16px;
    color: var(--fg); background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; cursor: pointer;
  }
  .controls button { flex: 1; }
  button:focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--apple); color: var(--apple-ink); border-color: transparent; font-size: 20px; padding: 14px 20px; width: 100%; }

  .overlay {
    position: absolute; inset: 0; z-index: 10; display: grid; place-items: center;
    padding: 16px; background: color-mix(in srgb, var(--bg) 55%, transparent);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .card {
    width: min(340px, 100%); background: var(--card); border-radius: 18px;
    padding: 22px 20px 20px; box-shadow: 0 16px 40px var(--shadow);
    display: flex; flex-direction: column; gap: 14px; text-align: center;
  }
  .card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; color: var(--apple); text-wrap: balance; }
  .card p { margin: 0; line-height: 1.6; color: var(--muted); }
  .card p b { color: var(--fg); font-family: var(--font-display); font-weight: 400; font-size: 1.15em; }
  .result { display: flex; justify-content: center; gap: 28px; }
  .result div { display: flex; flex-direction: column; }
  .result span { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  .result strong { font-family: var(--font-display); font-weight: 400; font-size: 40px; font-variant-numeric: tabular-nums; }
  .badge { align-self: center; padding: 3px 12px; border-radius: 999px; background: var(--sel); color: var(--card); font-family: var(--font-display); }

  @media (prefers-reduced-motion: reduce) {
    .apple, .apple.pop, .apple.hint, .float { animation: none; transition: none; }
    .apple.pop { visibility: hidden; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="hud">
    <h1 class="logo">사과 팡 <small>합 10</small></h1>
    <div class="stats">
      <div class="stat"><span class="label">점수</span><span id="score" class="val">0</span></div>
      <div class="stat"><span class="label">최고</span><span id="best" class="val">0</span></div>
    </div>
  </header>

  <div class="timer" id="timer" role="progressbar" aria-label="남은 시간" aria-valuemin="0" aria-valuemax="120" aria-valuenow="120">
    <div class="timer-fill" id="timerFill"></div>
    <span class="timer-text" id="timerText">2:00</span>
  </div>

  <section class="board-wrap" id="boardWrap">
    <div class="board" id="board" aria-label="사과 상자">
      <div class="sel-box" id="selBox" hidden><span class="sel-sum" id="selSum"></span></div>
    </div>
  </section>

  <footer class="controls">
    <button id="hintBtn" type="button">힌트 <span id="hintLeft">3</span></button>
    <button id="soundBtn" type="button" aria-pressed="true">소리 켜짐</button>
    <button id="restartBtn" type="button">새 게임</button>
  </footer>

  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="ovTitle">사과 팡</h2>
      <p id="ovText">손가락으로 사각형을 그려 사과를 묶으세요.<br>숫자의 합이 <b>10</b>이 되면 팡! 터집니다.<br>제한 시간은 <b>2분</b>이에요.</p>
      <div class="result" id="ovResult" hidden>
        <div><span>이번 점수</span><strong id="ovScore">0</strong></div>
        <div><span>최고 점수</span><strong id="ovBest">0</strong></div>
      </div>
      <span class="badge" id="ovBadge" hidden>새 기록!</span>
      <button class="primary" id="startBtn" type="button">시작하기</button>
    </div>
  </div>
</main>

<script>
(() => {
  const COLS = 10, ROWS = 15, TIME = 120, HINTS = 3, BEST_KEY = 'pang_apple_best';
  const $ = (id) => document.getElementById(id);
  const board = $('board'), wrap = $('boardWrap'), selBox = $('selBox'), selSum = $('selSum');
  const overlay = $('overlay');

  let grid = [], cells = [], cs = 34;
  let score = 0, best = 0, timeLeft = TIME, hints = HINTS, state = 'ready';
  let sound = true, actx = null, lastFrame = 0;
  let drag = null, selection = { cells: [], sum: 0 };

  const read = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  best = Number(read(BEST_KEY)) || 0;

  // ---------- board ----------
  function randomGrid() {
    let g;
    do {
      g = Array.from({ length: ROWS }, () => Array.from({ length: COLS }, () => 1 + Math.floor(Math.random() * 9)));
    } while (!findMove(g));
    return g;
  }

  // Returns the first rectangle whose numbers sum to exactly 10, or null.
  function findMove(g = grid) {
    const P = Array.from({ length: ROWS + 1 }, () => new Array(COLS + 1).fill(0));
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        P[r + 1][c + 1] = g[r][c] + P[r][c + 1] + P[r + 1][c] - P[r][c];
    const sum = (r0, c0, r1, c1) => P[r1 + 1][c1 + 1] - P[r0][c1 + 1] - P[r1 + 1][c0] + P[r0][c0];
    for (let r0 = 0; r0 < ROWS; r0++)
      for (let r1 = r0; r1 < ROWS; r1++)
        for (let c0 = 0; c0 < COLS; c0++)
          for (let c1 = c0; c1 < COLS; c1++) {
            const s = sum(r0, c0, r1, c1);
            if (s === 10) return { r0, c0, r1, c1 };
            if (s > 10) break;
          }
    return null;
  }

  function buildBoard() {
    cells.forEach((el) => el.remove());
    cells = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const el = document.createElement('div');
        el.className = 'apple' + (grid[r][c] ? '' : ' gone');
        el.style.setProperty('--r', r);
        el.style.setProperty('--c', c);
        el.innerHTML = '<b>' + (grid[r][c] || '') + '</b>';
        board.insertBefore(el, selBox);
        cells.push(el);
      }
    }
  }

  function layout() {
    const w = wrap.clientWidth - 16, h = wrap.clientHeight - 16;
    cs = Math.max(18, Math.floor(Math.min(w / COLS, h / ROWS)));
    board.style.setProperty('--cs', cs + 'px');
    board.style.width = cs * COLS + 'px';
    board.style.height = cs * ROWS + 'px';
  }

  // ---------- HUD ----------
  function renderHud() {
    $('score').textContent = score;
    $('best').textContent = best;
    $('hintLeft').textContent = hints;
    $('hintBtn').disabled = state !== 'play' || hints <= 0;
  }

  function renderTimer() {
    const secs = Math.ceil(timeLeft);
    $('timerFill').style.transform = 'scaleX(' + (timeLeft / TIME) + ')';
    $('timerText').textContent = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
    $('timer').classList.toggle('low', timeLeft <= 15);
    $('timer').setAttribute('aria-valuenow', secs);
  }

  function tick(t) {
    if (state !== 'play') return;
    const dt = Math.min((t - lastFrame) / 1000, 0.1); // clamp so a hidden tab doesn't burn time
    lastFrame = t;
    timeLeft = Math.max(0, timeLeft - dt);
    renderTimer();
    if (timeLeft <= 0) return endGame('time');
    requestAnimationFrame(tick);
  }

  // ---------- selection ----------
  function point(e) {
    const r = board.getBoundingClientRect();
    return {
      x: Math.min(Math.max(e.clientX - r.left, 0), r.width),
      y: Math.min(Math.max(e.clientY - r.top, 0), r.height),
    };
  }

  function clearSelection() {
    selection.cells.forEach(([r, c]) => cells[r * COLS + c].classList.remove('sel'));
    selection = { cells: [], sum: 0 };
    selBox.hidden = true;
    selBox.classList.remove('ten', 'over');
  }

  function updateSelection() {
    const x = Math.min(drag.x0, drag.x1), y = Math.min(drag.y0, drag.y1);
    const w = Math.abs(drag.x1 - drag.x0), h = Math.abs(drag.y1 - drag.y0);
    selection.cells.forEach(([r, c]) => cells[r * COLS + c].classList.remove('sel'));
    selection = { cells: [], sum: 0 };

    // An apple is in the box when its centre is.
    const c0 = Math.max(0, Math.ceil(x / cs - 0.5)), c1 = Math.min(COLS - 1, Math.floor((x + w) / cs - 0.5));
    const r0 = Math.max(0, Math.ceil(y / cs - 0.5)), r1 = Math.min(ROWS - 1, Math.floor((y + h) / cs - 0.5));
    for (let r = r0; r <= r1; r++)
      for (let c = c0; c <= c1; c++)
        if (grid[r][c]) {
          selection.cells.push([r, c]);
          selection.sum += grid[r][c];
          cells[r * COLS + c].classList.add('sel');
        }

    Object.assign(selBox.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    selBox.hidden = false;
    selSum.hidden = selection.sum === 0;
    selSum.textContent = '합 ' + selection.sum;
    selBox.classList.toggle('ten', selection.sum === 10);
    selBox.classList.toggle('over', selection.sum > 10);
  }

  board.addEventListener('pointerdown', (e) => {
    if (state !== 'play' || drag) return;
    e.preventDefault();
    board.setPointerCapture(e.pointerId);
    const p = point(e);
    drag = { id: e.pointerId, x0: p.x, y0: p.y, x1: p.x, y1: p.y };
    updateSelection();
  });
  board.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const p = point(e);
    drag.x1 = p.x; drag.y1 = p.y;
    updateSelection();
  });
  board.addEventListener('pointerup', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (state === 'play' && selection.sum === 10) pop(selection.cells);
    drag = null;
    clearSelection();
  });
  board.addEventListener('pointercancel', () => { drag = null; clearSelection(); });

  function pop(list) {
    let cx = 0, cy = 0;
    list.forEach(([r, c]) => {
      grid[r][c] = 0;
      const el = cells[r * COLS + c];
      el.classList.remove('sel', 'hint');
      el.classList.add('pop');
      el.addEventListener('animationend', () => el.classList.add('gone'), { once: true });
      cx += (c + 0.5) * cs; cy += (r + 0.5) * cs;
    });
    score += list.length;
    floatText('+' + list.length, cx / list.length, cy / list.length);
    blip(list.length);
    try { navigator.vibrate && navigator.vibrate(18); } catch (e) {}
    renderHud();

    if (grid.every((row) => row.every((v) => v === 0))) endGame('clear');
    else if (!findMove()) setTimeout(() => state === 'play' && endGame('stuck'), 450);
  }

  function floatText(text, x, y) {
    const el = document.createElement('div');
    el.className = 'float';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    board.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  // ---------- sound ----------
  function blip(n) {
    if (!sound || !actx) return;
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(440 + n * 60, t);
    o.frequency.exponentialRampToValueAtTime(880 + n * 80, t + 0.08);
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + 0.2);
  }

  function ensureAudio() {
    if (actx) return;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }

  // ---------- game flow ----------
  function showOverlay(title, text, withResult, newBest, button) {
    $('ovTitle').textContent = title;
    $('ovText').innerHTML = text;
    $('ovResult').hidden = !withResult;
    $('ovScore').textContent = score;
    $('ovBest').textContent = best;
    $('ovBadge').hidden = !newBest;
    $('startBtn').textContent = button;
    overlay.hidden = false;
    $('startBtn').focus({ preventScroll: true });
  }

  function newGame() {
    grid = randomGrid();
    score = 0; timeLeft = TIME; hints = HINTS;
    buildBoard();
    play();
  }

  function play() {
    ensureAudio();
    if (actx && actx.state === 'suspended') actx.resume();
    overlay.hidden = true;
    state = 'play';
    renderHud(); renderTimer();
    lastFrame = performance.now();
    requestAnimationFrame(tick);
  }

  function endGame(reason) {
    state = 'over';
    drag = null; clearSelection();
    const newBest = score > best;
    if (newBest) { best = score; write(BEST_KEY, String(best)); }
    renderHud();
    const titles = {
      time: ['시간 종료!', '2분이 다 됐어요. 한 판 더 해볼까요?'],
      stuck: ['더 이상 10이 없어요', '남은 사과로는 합 10을 만들 수 없어요.'],
      clear: ['상자를 다 비웠어요!', '사과 ' + COLS * ROWS + '개를 모두 터뜨렸어요. 대단해요!'],
    };
    showOverlay(titles[reason][0], titles[reason][1], true, newBest, '다시 하기');
  }

  $('startBtn').addEventListener('click', () => (state === 'paused' ? play() : newGame()));
  $('restartBtn').addEventListener('click', newGame);
  $('hintBtn').addEventListener('click', () => {
    if (state !== 'play' || hints <= 0) return;
    const m = findMove();
    if (!m) return;
    hints--;
    renderHud();
    for (let r = m.r0; r <= m.r1; r++)
      for (let c = m.c0; c <= m.c1; c++) {
        const el = cells[r * COLS + c];
        if (!grid[r][c]) continue;
        el.classList.remove('hint'); void el.offsetWidth; el.classList.add('hint');
        el.addEventListener('animationend', () => el.classList.remove('hint'), { once: true });
      }
  });
  $('soundBtn').addEventListener('click', () => {
    sound = !sound;
    $('soundBtn').setAttribute('aria-pressed', String(sound));
    $('soundBtn').textContent = sound ? '소리 켜짐' : '소리 꺼짐';
    if (sound) ensureAudio();
  });

  // Pause when the tab is hidden so a phone call or app switch doesn't cost the round.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'play') {
      state = 'paused';
      drag = null; clearSelection();
      showOverlay('잠시 멈춤', '돌아오면 이어서 할 수 있어요.', true, false, '이어하기');
    }
  });

  window.addEventListener('resize', layout);
  new ResizeObserver(layout).observe(wrap);

  // ---------- boot ----------
  function start(data) {
    if (data && Array.isArray(data.grid) && data.grid.length === ROWS) {
      grid = data.grid; score = data.score || 0; timeLeft = data.timeLeft ?? TIME; hints = data.hints ?? HINTS;
      sound = data.sound ?? true;
      buildBoard(); layout(); renderHud(); renderTimer();
      if (data.state === 'play' || data.state === 'paused') {
        state = 'paused';
        showOverlay('잠시 멈춤', '게임이 업데이트됐어요. 이어서 해 보세요.', true, false, '이어하기');
      }
      return;
    }
    grid = randomGrid();
    buildBoard(); layout(); renderHud(); renderTimer();
  }

  window.claude?.hot?.snapshot?.(() => ({ grid, score, timeLeft, hints, state, sound }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
