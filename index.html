<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>합주팡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="stat">
      <span class="label">점수</span>
      <span class="value" id="score">0</span>
    </div>
    <div class="stat">
      <span class="label">최고</span>
      <span class="value small" id="best">0</span>
    </div>
    <div class="next">
      <span class="label">다음</span>
      <canvas id="next" width="88" height="88" aria-label="다음 악기"></canvas>
    </div>
  </header>

  <main id="stage" class="stage">
    <canvas id="board" aria-label="악기를 떨어뜨리는 판"></canvas>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <section id="intro" class="overlay">
      <div class="card">
        <h1>합주팡</h1>
        <p>같은 악기 둘이 만나면 더 큰 악기가 돼요.<br>새 악기는 다음 첫 박을 기다렸다가 모두와 같은 순간에 들어가요. 8초 동안 자기 가락을 연주하고, 피아노는 16초 멜로디를 들려줘요. 악기가 모일수록 하나의 오케스트라가 돼요.</p>
        <ol id="roster" class="roster"></ol>
        <button id="startBtn" class="btn primary" type="button">연주 시작</button>
        <p class="hint">판을 눌러 위치를 정하고, 손을 떼면 떨어져요.</p>
      </div>
    </section>

    <section id="over" class="overlay" hidden>
      <div class="card">
        <h2>커튼콜</h2>
        <p>판에 남은 <b id="finalCount">0</b>종의 악기가 마지막 합주를 하고 있어요.</p>
        <p class="final"><span id="final">0</span>점</p>
        <button id="againBtn" class="btn primary" type="button">다시 연주</button>
      </div>
    </section>
  </main>

  <footer class="dock">
    <div class="now">
      <span id="count" class="count">쉼표</span>
      <span id="playing" class="playing idle">악기를 떨어뜨리면 첫 박부터 연주가 시작돼요</span>
    </div>
    <div id="baton" class="baton" aria-label="지휘 박자: 4마디, 마디마다 4박"></div>
    <ol id="chain" class="chain" aria-label="악기 진화 순서"></ol>
    <div class="actions">
      <button id="ensembleBtn" class="btn" type="button">판 위 악기 모두 연주</button>
      <button id="muteBtn" class="btn ghost" type="button" aria-pressed="false">소리 끄기</button>
    </div>
  </footer>
</div>
<script src="lib/matter.min.js"></script>
<script src="src/instruments.js"></script>
<script src="src/music.js"></script>
<script src="src/game.js"></script>
</body>
</html>
